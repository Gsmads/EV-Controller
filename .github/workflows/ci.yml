# ============================================================================
#  CI — сборка и прогон десктопных тестов.
#
#  Задача 0.2.3 из docs/SLICE_0_PLAN.md: "сборка и прогон tests/, падение при
#  любом failed". Плюс сторож задачи 0.2.6 (в tests/ только исходники).
#
#  Чего этот файл НЕ покрывает — честно:
#    - железа здесь нет. Прошивка собирается и компонуется под ATmega328P
#      (шаг avr-g++, ADR-0025), но не исполняется. Всё, что проверяется
#      только на контроллере — тайминги, регистры периферии, поведение
#      watchdog, — остаётся за критериями приёмки в ADR;
#    - списки исключений сторожей пусты: и по заголовкам (ADR-0021), и по
#      функциям Arduino (ADR-0025, задача #32 закрыта). Чего не
#      покрывают сами сторожа — в шапке tools/ci/check_layer_boundaries.py;
#      их собственная самопроверка (38 случаев) идёт первым шагом: сторож,
#      который сломан, обязан падать раньше, чем выносит вердикт о коде;
#    - предупреждения компилятора не блокируют. `make run` идёт на -Wall -Wextra
#      и сегодня чист, но `make verbose` (+ -Wpedantic -Wshadow -Wcast-align
#      -Wconversion) даёт 103 предупреждения и в CI не включён;
#    - `make run` останавливается на первом упавшем наборе, поэтому за один
#      прогон виден только первый. Полный список падений — отдельная правка
#      цели run в tests/Makefile, здесь она не делается;
#    - защита ветки (запрет слияния при красном CI) настраивается в GitHub,
#      файлом workflow её не задать.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Десктопные тесты
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Версия компилятора
        run: g++ --version

      # Первым делом: проверить сами сторожа. Зелёный сторож, который ничего
      # не смотрит, хуже отсутствующего — он выдаёт тишину за проверку.
      - name: Самопроверка сторожей границ
        run: tools/ci/test_check_layer_boundaries.py

      # Раньше сборки: после make в tests/ появляются бинарники, и порядок
      # шагов не должен влиять на результат проверки. Сторож смотрит индекс
      # git, а не каталог, поэтому на собранные файлы он и так не реагирует.
      - name: Сторож — в tests/ только исходники
        run: tools/ci/check_no_test_binaries.sh

      - name: Сторож — платформенные заголовки только в HAL
        run: tools/ci/check_layer_boundaries.py headers

      - name: Сторож — функции Arduino не вызываются
        run: tools/ci/check_layer_boundaries.py functions

      - name: Сторож — каждый модуль firmware/ компилируется
        run: tools/ci/check_modules_compile.sh

      - name: Сборка и прогон тестов
        working-directory: tests
        run: make run

      # Первая настоящая сборка под целевой контроллер. До ADR-0025 её не
      # было вовсе: HAL звал функции ядра Arduino, а ядра в CI нет. Теперь
      # прошивка собирается avr-g++ и компонуется — значит проверяются и
      # регистры, и размещение в памяти, чего десктопный -fsyntax-only
      # не даёт в принципе.
      - name: AVR-тулчейн
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-avr avr-libc

      - name: Сборка прошивки под ATmega328P
        working-directory: firmware
        run: make

      # Расход памяти печатается в лог: 2 КБ ОЗУ - величина, которую нельзя
      # узнать постфактум, когда прошивка перестанет помещаться.
      - name: Расход флеша и ОЗУ
        working-directory: firmware
        run: make size
