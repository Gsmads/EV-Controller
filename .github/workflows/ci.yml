# ============================================================================
#  CI — сборка и прогон десктопных тестов.
#
#  Задача 0.2.3 из docs/SLICE_0_PLAN.md: "сборка и прогон tests/, падение при
#  любом failed". Плюс сторож задачи 0.2.6 (в tests/ только исходники).
#
#  Чего этот файл НЕ покрывает — честно:
#    - прошивку целиком он не собирает. В tests/Makefile участвуют четыре файла
#      из firmware/ (util_math, cfg_settings, util_crc, svc_ramp); остальные
#      девять .cpp не проверяются даже на синтаксис. Сборка скетча требует
#      Arduino-тулчейна и сегодня всё равно невозможна: EV_Controller.ino:152
#      вызывает hal_uart_init(UART_BAUD_DEBUG), а такого макроса в репозитории
#      нет ни в одном заголовке;
#    - сторожей границ слоёв (задачи 0.2.4 и 0.2.5) здесь пока нет: на текущем
#      коде они красные, решение по ним за владельцем;
#    - предупреждения компилятора не блокируют. `make run` идёт на -Wall -Wextra
#      и сегодня чист, но `make verbose` (+ -Wpedantic -Wshadow -Wcast-align
#      -Wconversion) даёт 103 предупреждения и в CI не включён;
#    - `make run` останавливается на первом упавшем наборе, поэтому за один
#      прогон виден только первый. Полный список падений — отдельная правка
#      цели run в tests/Makefile, здесь она не делается;
#    - защита ветки (запрет слияния при красном CI) настраивается в GitHub,
#      файлом workflow её не задать.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Десктопные тесты
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Версия компилятора
        run: g++ --version

      # Раньше сборки: после make в tests/ появляются бинарники, и порядок
      # шагов не должен влиять на результат проверки. Сторож смотрит индекс
      # git, а не каталог, поэтому на собранные файлы он и так не реагирует.
      - name: Сторож — в tests/ только исходники
        run: tools/ci/check_no_test_binaries.sh

      - name: Сборка и прогон тестов
        working-directory: tests
        run: make run
